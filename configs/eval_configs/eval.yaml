model:
  arch: hawk
  model_type: pretrain_llama_v2
  freeze_vit: True
  freeze_qformer: True
  max_txt_len: 512
  end_sym: "</s>"
  low_resource: False

  frozen_llama_proj: False

  # Use LLaMA-2-chat as base modal

  # some ckpts could be download from Video_LLaMA-2-7B-Finetuned
  # https://huggingface.co/DAMO-NLP-SG/Video-LLaMA-2-7B-Finetuned
  llama_model: "/home/work/seoik/hawk/weights/Video-LLaMA-2-7B-Finetuned/llama-2-7b-chat-hf"

  # Hawk Weight
  # 기본값은 stage-1 최종 체크포인트. 평가 대상은 보통 stage-2 또는 어블레이션 arm 의
  # 체크포인트이므로, scripts/evaluate.py --ckpt 로 덮어쓰는 것을 전제로 한다.
  ckpt: '/home/work/seoik/runs/core/main/checkpoint_106.pth'

  equip_audio_branch: False

  fusion_head_layers: 2
  max_frame_pos: 32
  fusion_header_type: "seqTransf"

datasets:
  webvid:
    vis_processor:
      train:
        name: "alpro_video_eval"
        n_frms: 32
        image_size: 224
    text_processor:
      train:
        name: "blip_caption"

run:
  task: video_text_pretrain
